
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java (requis par Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Générer l'icône de l'application
        run: npx capacitor-assets generate --android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobipass-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
